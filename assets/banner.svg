<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manish Soni - Software Developer banner">
  <defs>
    <linearGradient id="grad1" x1="0" x2="1">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="grad2" x1="0" x2="1">
      <stop offset="0%" stop-color="#06202a" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <mask id="fadeMask">
      <rect x="0" y="0" width="1200" height="360" fill="white" />
      <rect x="0" y="260" width="1200" height="100" fill="black" opacity="0.6" />
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="#05060a" />

  <!-- Soft gradient streaks -->
  <rect x="-200" y="-100" width="1400" height="560" fill="url(#grad1)" opacity="0.06" transform="rotate(-12 600 180)" />
  <rect x="-200" y="-100" width="1400" height="560" fill="url(#grad1)" opacity="0.03" transform="rotate(8 600 180)" />

  <!-- Circuit decorations (stylized) -->
  <g stroke="url(#grad1)" stroke-width="1.4" fill="none" opacity="0.9" filter="url(#glow)">
    <path d="M60 80 L140 80 L180 120 L260 120" stroke-linecap="round" />
    <circle cx="60" cy="80" r="3.2" fill="#00e5ff" />
    <circle cx="260" cy="120" r="3.2" fill="#a855f7" />

    <path d="M980 260 L1060 220 L1090 220 L1140 200" stroke-linecap="round" />
    <circle cx="980" cy="260" r="3.2" fill="#00e5ff" />
    <circle cx="1140" cy="200" r="3.2" fill="#a855f7" />
  </g>

  <!-- Central card -->
  <g transform="translate(80,40)">
    <rect width="1040" height="240" rx="14" ry="14" fill="url(#grad2)" opacity="0.75" />
    <rect x="2" y="2" width="1036" height="236" rx="12" ry="12" fill="none" stroke="rgba(255,255,255,0.04)" />

    <!-- Accent line -->
    <rect x="8" y="8" width="1024" height="6" rx="3" fill="url(#grad1)" opacity="0.9" />

    <!-- Name -->
    <text x="40" y="90" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="44" fill="#e6f7ff">Manish Soni</text>

    <!-- Title -->
    <text x="40" y="130" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#cbdcff">Software Developer</text>

    <!-- Skills pill -->
    <g transform="translate(40,150)">
      <rect x="0" y="0" width="380" height="40" rx="8" ry="8" fill="#071026" stroke="url(#grad1)" />
      <text x="18" y="26" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#a6f1ff">Java</text>
      <text x="110" y="26" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#d7c7ff">| Full Stack</text>
      <text x="260" y="26" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#a6f1ff">| AI</text>
    </g>

    <!-- Terminal-like block -->
    <g transform="translate(720,28)">
      <rect x="0" y="0" width="300" height="120" rx="8" ry="8" fill="#02060a" stroke="rgba(255,255,255,0.03)" />
      <text x="18" y="36" font-family="monospace" font-size="14" fill="#2de0c9">manish@dev:~$</text>
      <text x="18" y="60" font-family="monospace" font-size="12" fill="#9fd7ff">backend • apis • ai</text>

      <!-- small circuit lines -->
      <path d="M18 88 L60 88 L80 108" stroke="#6ee7ff" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.85" />
      <circle cx="18" cy="88" r="2.5" fill="#6ee7ff" />
    </g>

  </g>

  <!-- Subtle bottom glow -->
  <ellipse cx="600" cy="320" rx="420" ry="36" fill="url(#grad1)" opacity="0.04" mask="url(#fadeMask)" />

  <!-- Accessibility: title and description (for screen readers) -->
  <title>Manish Soni – Software Developer</title>
  <desc>Dark futuristic banner with cyan and purple gradient accents, circuit motifs, and a terminal-styled callout listing skills Java, Full Stack, AI.</desc>
</svg>
