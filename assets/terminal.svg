<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="220" viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal introduction for Manish Soni">
  <defs>
    <linearGradient id="termBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0f14" />
      <stop offset="100%" stop-color="#051018" />
    </linearGradient>
  </defs>

  <rect width="820" height="220" rx="10" fill="url(#termBg)" />

  <!-- Header dots -->
  <g transform="translate(16,14)">
    <circle cx="12" cy="12" r="8" fill="#ff5f57" />
    <circle cx="36" cy="12" r="8" fill="#ffbd2e" />
    <circle cx="60" cy="12" r="8" fill="#28c840" />
  </g>

  <!-- Terminal content -->
  <g transform="translate(20,50)">
    <text x="0" y="0" font-family="monospace" font-size="20" fill="#58f0d6">manish@dev:~$ <tspan fill="#e6f7ff">whoami</tspan></text>

    <text x="0" y="40" font-family="monospace" font-size="16" fill="#cfeef8">Software Engineering Graduate</text>

    <text x="0" y="70" font-family="monospace" font-size="14" fill="#9fd7ff">Focus: Backend Systems, APIs, AI-Integrated Apps</text>

    <!-- subtle prompt cursor -->
    <rect x="0" y="6" width="8" height="18" fill="#00f0d1" opacity="0.85" rx="1" ry="1">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="1.2s" repeatCount="indefinite" />
    </rect>

    <!-- decorative circuit motif to the right -->
    <g transform="translate(520,6)" stroke="#4de8ff" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M0 0 L40 0 L40 26 L80 26" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#4de8ff" />
      <circle cx="80" cy="26" r="3" fill="#a865f7" />
    </g>
  </g>

  <title>Terminal introduction: manish@dev</title>
  <desc>Minimal terminal-style SVG showing a whoami prompt and short bio lines for Manish Soni.</desc>
</svg>
